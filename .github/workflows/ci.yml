name: CI

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true # Keep test run unblocked if linting has non-critical warnings

      - name: Run unit & component tests
        run: npm run test
